[X2TestHarness.X2TH_AutoTestMgr]
; Seconds to wait on the Geoscape before running, so the strategy layer finishes setting up.
SettleSeconds=5
; Save to load, by its file name in SaveData.
SaveName=save_Save 402
; Test classes to run, in order. Each extends X2TH_Test.
+TestClasses="X2TestHarness.X2TH_Test_LWOTCLoaded"
+TestClasses="X2TestHarness.X2TH_Test_HavenAdvisor"
